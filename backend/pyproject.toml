[project]
name = "cybersentinel-backend"
version = "1.0.0"
description = "CyberSentinel — ML-based network threat detection platform (FastAPI backend)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that train small fixture models or process larger files",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A", "C4", "SIM", "RUF"]
ignore = [
    "S101",    # asserts are used deliberately in tests and invariants
    "S105",    # false positives on token-type literals
    "S106",
    "S608",    # SQL built only from trusted enum literals in CHECK constraints
    "RUF012",
    "B008",    # FastAPI dependency defaults
    "SIM117",
    "SIM108",  # explicit if/else is kept where it reads better
    "RUF001",  # typographic characters (en dash, minus, ×) are intentional in user-facing text and docs
    "RUF002",
    "RUF003",
    "UP046",   # typing.Generic kept for compatibility with pydantic generic models
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE", "B017"]
"app/api/v1/endpoints/**" = ["A002"]  # `format` is a public query-parameter name

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
